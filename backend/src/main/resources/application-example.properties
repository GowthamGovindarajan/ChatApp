# ==========================================================
# Chat Application Configuration
# Copy this file to application.properties
# and replace the placeholder values.
# ==========================================================

# ---------------- Server ----------------
server.port=8080

# ---------------- MySQL ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------- Jackson ----------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------------- Logging ----------------
logging.level.com.chatapp=DEBUG
logging.level.org.springframework.web.socket=DEBUG